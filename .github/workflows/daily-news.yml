name: Tri-Lens Daily News

on:
  schedule:
    # Runs at 7:30 KST (22:30 UTC) daily
    # GitHub Actions cron can delay 5-30 min, so we trigger early to land around 8:00 KST
    - cron: '30 22 * * *'
  workflow_dispatch: # Manual trigger for testing

permissions:
  contents: write # 발송분 아카이브를 커밋한다

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Fetch news and send email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          # 모델을 바꾸려면 repo variable GEMINI_MODEL을 설정한다. 비어 있으면 스크립트 기본값을 쓴다
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/daily_news.py

      # 알림 스텝보다 앞에 둔다. 커밋이나 push가 실패해도 그 자체로 알림이 나가야 한다
      - name: Commit the archived digest
        run: |
          if [ -z "$(git status --porcelain archive/)" ]; then
            echo "아카이브에 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/
          git commit -m "chore(archive): ${ARCHIVE_DATE}"
          # 사람이 같은 시간에 밀어 넣었을 수 있다. 되감고 올린다
          git pull --rebase origin main
          git push origin HEAD:main

      # 실패한 run에서만 실행된다. 알림은 RECIPIENTS가 아니라 발신 계정 자신에게 간다
      - name: Report a failed run
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # setup-python 자체가 실패한 경우에도 돌 수 있도록 러너 기본 python3를 쓴다
        run: python3 scripts/notify_failure.py
